name: Verify BDI package consumer

# This repository verifies CCRS strictly through the published package boundary.

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Verify ${{ matrix.capabilities }} capabilities
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        capabilities:
          - none
          - hypermedea
          - langchain4j
          - a2a
          - all
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve CCRS packages and verify the application
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/ccrs-bdi-gradle-${{ matrix.capabilities }}
        run: >-
          ./gradlew
          -PccrsCapabilities=${{ matrix.capabilities }}
          --refresh-dependencies
          clean test classes printCcrsCapabilities
