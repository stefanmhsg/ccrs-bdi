pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        def ccrsRepositoryUrl = providers.gradleProperty('ccrsRepositoryUrl')
        def githubPackagesUser = providers.gradleProperty('gpr.user')
            .orElse(providers.environmentVariable('GITHUB_ACTOR'))
        def githubPackagesToken = providers.gradleProperty('gpr.key')
            .orElse(providers.environmentVariable('GITHUB_TOKEN'))

        exclusiveContent {
            forRepository {
                maven {
                    if (ccrsRepositoryUrl.present) {
                        name = 'ccrsStaging'
                        url = uri(ccrsRepositoryUrl.get())
                    } else {
                        name = 'GitHubPackages'
                        url = uri('https://maven.pkg.github.com/stefanmhsg/ccrs')
                        credentials {
                            username = githubPackagesUser.orNull
                            password = githubPackagesToken.orNull
                        }
                        mavenContent {
                            snapshotsOnly()
                        }
                    }
                }
            }
            filter {
                includeGroup('io.github.stefanmhsg.ccrs')
            }
        }

        mavenCentral()
        maven { url = uri('https://raw.githubusercontent.com/jacamo-lang/mvn-repo/master') }
        maven { url = uri('https://repo.gradle.org/gradle/libs-releases') }
        maven { url = uri('https://hypermedea.github.io/maven') }
        maven { url = uri('https://jitpack.io') }
    }
}

rootProject.name = 'ccrs-bdi'
