/*
   Project ccrs_bdi

   Gradle build file for JaCaMo Applications
   Oktober 26, 2025 - 17:53:27
*/

plugins {
    id 'com.gradleup.shadow' version '8.3.3'
    id 'java'
}

defaultTasks = ['run']

apply from: '.jcm-deps.gradle' // this file contains dependencies declared in the .jcm files

version = '0.1.0-SNAPSHOT'
group = 'io.github.stefanmhsg.ccrs'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

def ccrsVersion = providers.gradleProperty('ccrsVersion')
    .getOrElse('0.1.0-SNAPSHOT')

configurations.configureEach {
    // Check for newly published snapshots whenever dependencies are resolved.
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

def knownCcrsCapabilities = ['hypermedea', 'langchain4j', 'a2a'] as Set
def requestedCcrsCapabilities = providers.gradleProperty('ccrsCapabilities')
    .getOrElse('all')
    .split(',')
    .collect { it.trim().toLowerCase() }
    .findAll { !it.isEmpty() } as Set

if (requestedCcrsCapabilities.contains('all') && requestedCcrsCapabilities.size() != 1) {
    throw new GradleException("Use 'all' by itself in -PccrsCapabilities.")
}
if (requestedCcrsCapabilities.contains('none') && requestedCcrsCapabilities.size() != 1) {
    throw new GradleException("Use 'none' by itself in -PccrsCapabilities.")
}

def unknownCcrsCapabilities = requestedCcrsCapabilities.findAll {
    it != 'all' && it != 'none' && !knownCcrsCapabilities.contains(it)
}
if (!unknownCcrsCapabilities.isEmpty()) {
    throw new GradleException(
        "Unknown CCRS capabilities: ${unknownCcrsCapabilities.sort().join(', ')}. " +
        "Choose none, all, or a comma-separated subset of ${knownCcrsCapabilities.sort().join(', ')}."
    )
}

def enabledCcrsCapabilities = requestedCcrsCapabilities.contains('all')
    ? knownCcrsCapabilities
    : requestedCcrsCapabilities.contains('none')
        ? [] as Set
        : requestedCcrsCapabilities

dependencies {
    implementation "io.github.stefanmhsg.ccrs:ccrs-core:${ccrsVersion}"
    implementation "io.github.stefanmhsg.ccrs:ccrs-jacamo:${ccrsVersion}"

    if (enabledCcrsCapabilities.contains('hypermedea')) {
        runtimeOnly "io.github.stefanmhsg.ccrs:ccrs-hypermedea:${ccrsVersion}"
    }
    if (enabledCcrsCapabilities.contains('langchain4j')) {
        runtimeOnly "io.github.stefanmhsg.ccrs:ccrs-langchain4j:${ccrsVersion}"
    }
    if (enabledCcrsCapabilities.contains('a2a')) {
        runtimeOnly "io.github.stefanmhsg.ccrs:ccrs-a2a:${ccrsVersion}"
    }
}

tasks.register('printCcrsCapabilities') {
    group = 'help'
    description = 'Prints the optional CCRS capability modules selected for this build.'
    doLast {
        def selected = enabledCcrsCapabilities.isEmpty()
            ? 'none (core and JaCaMo only)'
            : enabledCcrsCapabilities.sort().join(', ')
        println "CCRS capabilities: ${selected}"
    }
}

sourceSets {
    audit {
        java.srcDir 'src/audit/java'
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
    main {
        java {
            srcDir 'src/env'
            srcDir 'src/agt'
            srcDir 'src/org'
            srcDir 'src/int'
            srcDir 'src/java'
        }
        resources {
            srcDir 'src/resources'
        }
    }
}

task run (type: JavaExec, dependsOn: 'classes') {
    group = ' JaCaMo'
    description = 'runs the JaCaMo application'
    doFirst {
        mkdir 'log'
    }
    mainClass = 'jacamo.infra.JaCaMoLauncher'
    if (project.hasProperty('jcm')) {
        args project.jcm
    } else {
        args 'ccrs_bdi.jcm'
    }
    // jvmArgs '-Xss15m'
    classpath sourceSets.main.runtimeClasspath
}

task buildJCMDeps (type: JavaExec, dependsOn: 'classes') {
    mainClass = 'jacamo.infra.RunJaCaMoProject'
    args = ['ccrs_bdi.jcm', '--deps']
    classpath sourceSets.main.runtimeClasspath
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    archiveBaseName = project.name

    from (project.projectDir.absolutePath + '/src') {
        include '**/*.asl'
        include '**/*.xml'
        include '**/*.sai'
        include '**/*.ptl'
        include '**/*.jcm'
        exclude 'test'
    }
    from (project.buildDir.absolutePath + '/classes') {
        include '**/*'
    }
    manifest {
        attributes 'Main-Class': 'jacamo.infra.JaCaMoLauncher'
    }
}

shadowJar {
    doFirst {
        copy {
            from 'ccrs_bdi.jcm'
            rename 'ccrs_bdi.jcm','default.jcm'
            into project.buildDir.absolutePath + '/jcm'
        }
    }
    archiveFileName = "jacamo-${project.name}-${project.version}-all.jar" // the name must start with jacamo so that jacamo...jar is found in the classpath
    from (project.projectDir.absolutePath + '/src') {
        include '**/*.asl'
        include '**/*.xml'
        include '**/*.sai'
        include '**/*.ptl'
        include '**/*.jcm'
        include '*.properties'
        exclude 'test'
    }
    from (project.buildDir.absolutePath + '/classes') {
        include '**/*'
    }
    from (project.buildDir.absolutePath + '/jcm') {
        include '**/*'
    }
    from (project.projectDir.absolutePath + '/') {
        include '*.properties'
    }

    doLast {
        println("You can run your application with: java -jar build/libs/jacamo-${project.name}-${project.version}-all.jar")
    }
}


task testJaCaMo(type: JavaExec) {
    description = 'Runs the opt-in JaCaMo agent test suite.'
    outputs.upToDateWhen { false } // disable cache

    doFirst {
        if (gradle.startParameter.logLevel.toString().equals("DEBUG")) {
            args = ['src/test/tests.jcm', '--log-conf', '$jason/templates/console-debug-logging.properties']
        } else if (gradle.startParameter.logLevel.toString().equals("INFO")) {
            args = ['src/test/tests.jcm', '--log-conf', '$jason/templates/console-info-logging.properties']
        } else {
            args = ['src/test/tests.jcm', '--log-conf', '$jason/templates/console-lifecycle-logging.properties']
        }
    }

    mainClass = 'jacamo.infra.JaCaMoLauncher'
    classpath sourceSets.main.runtimeClasspath
}

def agentSpeakTestFixtures = [
    file('src/test/tests.jcm'),
    file('src/test/agt/test-sample.asl'),
    file('src/test/agt/sample_agent.asl')
]

tasks.register('verifyAgentSpeakTestFixtures') {
    group = 'verification'
    description = 'Verifies that the application-owned JaCaMo test fixtures are complete.'
    inputs.files(agentSpeakTestFixtures)

    doLast {
        def missingFixtures = agentSpeakTestFixtures.findAll { !it.isFile() }
        if (!missingFixtures.isEmpty()) {
            throw new GradleException(
                "Missing JaCaMo test fixtures: ${missingFixtures*.path.join(', ')}"
            )
        }

        def testAgent = file('src/test/agt/test-sample.asl').getText('UTF-8')
        if (!testAgent.contains('include("sample_agent.asl")')) {
            throw new GradleException(
                'test-sample.asl must include the application-owned sample_agent.asl fixture.'
            )
        }
    }
}

tasks.register('verifyTerminalAudit', JavaExec) {
    group = 'verification'
    description = 'Checks application ASL syntax and UTC terminal action offline; starts no agent.'
    dependsOn tasks.named('auditClasses')
    classpath = sourceSets.audit.runtimeClasspath
    mainClass = 'TerminalAuditCheck'
}

tasks.named('test') {
    dependsOn tasks.named('verifyAgentSpeakTestFixtures')
    dependsOn tasks.named('verifyTerminalAudit')
}


clean {
    delete 'bin'
    delete 'build'
    delete 'log'
}
